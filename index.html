<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera Central</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">

    <!-- PANTALLA 1: LOGIN / REGISTRO -->
    <section id="step-login" class="step-view">
      <header>
        <h1>Billetera Central</h1>
        <p class="subtitle">Paso 1: Acceso a la cuenta</p>
      </header>
      <form id="login-form">
        <div class="input-group">
          <label for="username">Nombre de usuario</label>
          <input type="text" id="username" required placeholder="Ej. Carlos">
        </div>
        <div class="input-group">
          <label for="email">Correo electrónico (Confirmación)</label>
          <input type="email" id="email" required placeholder="tu@email.com">
        </div>
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn primary">Continuar ➔</button>
      </form>
    </section>

    <!-- PANTALLA 2: REGISTRO DE TARJETA -->
    <section id="step-add-card" class="step-view hidden">
      <header>
        <h1>Agregar Tarjeta</h1>
        <p class="subtitle">Paso 2: Datos del plástico</p>
      </header>
      <form id="card-form">
        <div class="input-group">
          <label for="bank-name">Entidad / Banco</label>
          <input type="text" id="bank-name" required placeholder="Ej. eBROU, Prex, Itaú">
        </div>
        <div class="input-group">
          <label for="card-number">Número de tarjeta</label>
          <input type="text" id="card-number" maxlength="19" required placeholder="4509 1234 5678 9012">
        </div>
        <div class="input-group">
          <label for="card-holder">Nombre del titular</label>
          <input type="text" id="card-holder" required placeholder="Como figura en la tarjeta">
        </div>
        <div class="row">
          <div class="input-group">
            <label for="expiry">Vencimiento</label>
            <input type="text" id="expiry" maxlength="5" required placeholder="MM/AA">
          </div>
          <div class="input-group">
            <label for="cvv">Código CVV</label>
            <input type="password" id="cvv" maxlength="4" required placeholder="123">
          </div>
        </div>
        <div class="input-group">
          <label for="balance">Saldo disponible ($)</label>
          <input type="number" step="0.01" id="balance" required placeholder="1000.00">
        </div>
        <button type="submit" class="btn primary">Vincular Tarjeta ➔</button>
      </form>
    </section>

    <!-- PANTALLA 3: BILLETERA / DASHBOARD -->
    <section id="step-dashboard" class="step-view hidden">
      <header class="dashboard-header">
        <div>
          <h1>Mis Tarjetas</h1>
          <p id="user-display" class="subtitle"></p>
        </div>
        <button id="logout-btn" class="btn icon-btn" title="Salir">🚪</button>
      </header>

      <main id="cards-list"></main>

      <div class="bottom-actions">
        <button id="go-add-another-btn" class="btn secondary">+ Agregar otra tarjeta</button>
        <button id="nfc-pay-btn" class="btn primary pay-btn">
          <span>📱</span> Pagar por Contactless (NFC)
        </button>
      </div>
    </section>

  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
